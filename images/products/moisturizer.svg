<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 560" fill="none">
  <defs>
    <linearGradient id="mo-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4f1f"/>
      <stop offset="0.28" stop-color="#c9a45c"/>
      <stop offset="0.5" stop-color="#f0dcab"/>
      <stop offset="0.72" stop-color="#c9a45c"/>
      <stop offset="1" stop-color="#6b4f1f"/>
    </linearGradient>
    <linearGradient id="mo-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.3" stop-color="#2a2624"/>
      <stop offset="0.55" stop-color="#453f3a"/>
      <stop offset="0.8" stop-color="#1a1715"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="mo-highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mo-lid-top" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#f0dcab"/>
      <stop offset="0.55" stop-color="#c9a45c"/>
      <stop offset="1" stop-color="#6b4f1f"/>
    </radialGradient>
  </defs>

  <ellipse cx="130" cy="546" rx="72" ry="10" fill="#000000" opacity="0.55"/>

  <!-- jar body (black glass) -->
  <path d="M70 296 L70 470 Q70 500 100 500 L160 500 Q190 500 190 470 L190 296 Z" fill="url(#mo-glass)"/>
  <path d="M70 296 L70 470 Q70 500 100 500 L160 500 Q190 500 190 470 L190 296 Z" fill="url(#mo-highlight)" opacity="0.6"/>

  <!-- gold rim under lid -->
  <rect x="70" y="292" width="120" height="10" rx="4" fill="url(#mo-gold)"/>

  <!-- lid -->
  <rect x="62" y="206" width="136" height="90" rx="16" fill="url(#mo-gold)"/>
  <rect x="62" y="206" width="136" height="90" rx="16" fill="url(#mo-lid-top)" opacity="0.55"/>
  <rect x="62" y="206" width="136" height="90" rx="16" fill="url(#mo-highlight)" opacity="0.35"/>
  <rect x="62" y="248" width="136" height="2.5" fill="#6b4f1f" opacity="0.45"/>

  <!-- label -->
  <rect x="82" y="340" width="96" height="120" rx="6" fill="none" stroke="#c9a45c" stroke-width="1.2" opacity="0.9"/>
  <text x="130" y="380" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16" fill="#e6d2a3" letter-spacing="0.5">Aamna's Elixir</text>
  <line x1="104" y1="396" x2="156" y2="396" stroke="#c9a45c" stroke-width="0.8" opacity="0.8"/>
  <text x="130" y="430" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#f5efe5" letter-spacing="3">MOISTURIZER</text>
</svg>
